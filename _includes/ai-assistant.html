<!-- indexGin Personal Site Assistant Widget (Maxime Heckel Inspired) -->
<div class="ai-agent-widget-container" id="aiAgentWidget">

  <!-- Floating Launcher Button -->
  <button class="ai-agent-launcher" id="aiAgentLauncher" aria-label="Open Personal Site Assistant" title="打开空间小助手">
    <span class="ai-launcher-pulse"></span>
    <span class="ai-launcher-icon">✨</span>
    <span class="ai-launcher-text font-mono">空间助手 <span class="badge-tag">// indexGin Bot</span></span>
  </button>

  <!-- Interactive Chat Modal -->
  <div class="ai-agent-modal" id="aiAgentModal" aria-hidden="true">
    
    <!-- Modal Header -->
    <div class="ai-modal-header">
      <div class="ai-header-info">
        <div class="ai-avatar-badge">
          <i class="fa fa-sparkles">✨</i>
        </div>
        <div>
          <h4 class="ai-assistant-name font-mono">indexGin 空间小助手</h4>
          <span class="ai-status-pill font-mono">
            <span class="ai-live-dot"></span> SITE_COMPANION // ONLINE
          </span>
        </div>
      </div>
      <div class="ai-header-actions">
        <button class="ai-clear-btn" id="aiClearBtn" title="清空对话"><i class="fa fa-refresh"></i></button>
        <button class="ai-close-btn" id="aiCloseBtn" title="关闭窗口">&times;</button>
      </div>
    </div>

    <!-- Quick Questions Pills Bar -->
    <div class="ai-quick-questions">
      <span class="quick-title font-mono"><i class="fa fa-bolt"></i> 快捷问答:</span>
      <div class="quick-pills-scroll">
        <button class="quick-pill" data-query="推荐几本近期在读书单（普鲁斯特、荷马史诗）？">📖 近期在读书单</button>
        <button class="quick-pill" data-query="介绍博主的开源贡献（deer-flow 等）">🚀 头部开源 PR 贡献</button>
        <button class="quick-pill" data-query="网站都有哪些好玩的功能？（算法沙盒、主题切换）">💡 网站特色功能</button>
        <button class="quick-pill" data-query="关于博主 indexGin 与研究方向？">👤 关于博主 indexGin</button>
        <button class="quick-pill" data-query="如何在书架中添加新书与豆瓣链接？">🛠️ 如何添加新书</button>
      </div>
    </div>

    <!-- Chat Messages Container -->
    <div class="ai-messages-container" id="aiMessagesContainer">
      <!-- Default Assistant Welcome Message -->
      <div class="ai-msg ai-msg-assistant">
        <div class="ai-msg-avatar"><i class="fa fa-smile-o"></i></div>
        <div class="ai-msg-bubble font-editorial">
          你好！我是 indexGin 网站的内置智能小助手。现已<strong>成功接入智谱 AI 云端大模型 (GLM-4-Flash)</strong>！你可以向我咨询关于 <strong>博主背景与研究</strong>、<strong>开源贡献 (deer-flow / agno)</strong>、<strong>运筹优化算法</strong>、<strong>豆瓣书单与文献 (普鲁斯特 / 荷马史诗)</strong> 以及站点功能的任何问题，我会实时为你解答～
        </div>
      </div>
    </div>

    <!-- Input Form -->
    <form class="ai-input-form" id="aiInputForm" onsubmit="return false;">
      <input type="text" 
             id="aiInputField" 
             class="ai-input-field font-mono" 
             placeholder="问我关于博客、开源项目、豆瓣书单或技术的问题..." 
             autocomplete="off">
      <button type="submit" id="aiSendBtn" class="ai-send-btn" title="发送">
        <i class="fa fa-paper-plane"></i>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="ai-modal-footer font-mono">
      <span>Personal AI Companion // Powered by Zhipu GLM-4-Flash</span>
    </div>

  </div>

</div>

<!-- AI Agent Script -->
<script src="{{ '/js/ai-agent.js' | prepend: site.baseurl }}?v=20261022"></script>
