<!-- Reading Scroll Progress Bar -->
<div class="reading-progress-bar" id="readingProgressBar"></div>

<!-- Navigation -->
{% if page.nav-style == "invert" or page.header-style == "text" %}
<nav class="navbar navbar-default navbar-custom navbar-fixed-top invert matrix-nav">
    {% else %}
    <nav class="navbar navbar-default navbar-custom navbar-fixed-top matrix-nav">
        {% endif %}
        <div class="container-fluid">
            <!-- Brand and toggle get grouped for better mobile display -->
            <div class="navbar-header page-scroll">
                <button type="button" class="navbar-toggle">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="{{ site.baseurl }}/">
                    <img src="{{ site.baseurl }}/img/logo.png" alt="indexGin Logo" class="nav-brand-logo">
                    <span class="node-prefix font-mono">[NODE:0]</span>
                    <span class="nav-brand-title">indexGin</span>
                    <span class="node-sublabel font-mono">// OR_LAB</span>
                    <span class="graph-status-badge font-mono" title="Status: Optimal">
                        <span class="graph-node-dot"></span>
                        <span class="graph-status-text">LLM4OR_GRAPH</span>
                    </span>
                </a>
            </div>

            <!-- Collect the nav links, forms, and other content for toggling -->
            <div id="huxblog_navbar">
                <div class="navbar-collapse">
                    <ul class="nav navbar-nav navbar-right font-mono">
                        <li>
                            <a href="{{ site.baseurl }}/">
                                <span class="node-id">01_</span>Home
                            </a>
                        </li>
                        <li>
                            <a href="{{ site.baseurl }}/projects/">
                                <span class="node-id">02_</span>Projects
                            </a>
                        </li>
                        <li>
                            <a href="{{ site.baseurl }}/library/">
                                <span class="node-id">03_</span>Library
                            </a>
                        </li>
                        <li>
                            <a href="{{ site.baseurl }}/demos/">
                                <span class="node-id">04_</span>Demos
                            </a>
                        </li>
                        <li>
                            <a href="{{ site.baseurl }}/archive/">
                                <span class="node-id">05_</span>Archive
                            </a>
                        </li>
                        <li>
                            <a href="{{ site.baseurl }}/about/">
                                <span class="node-id">06_</span>About
                            </a>
                        </li>
                        <li class="search-icon">
                            <a href="javascript:void(0)" title="Search Node">
                                <i class="fa fa-search"></i>
                            </a>
                        </li>
                        <li class="github-nav-item">
                            <a href="https://github.com/indexGin" target="_blank" title="GitHub @indexGin">
                                <i class="fa fa-github"></i>
                            </a>
                        </li>
                        <!-- Theme Toggle Button (Top Right) -->
                        <li class="theme-toggle-nav-item">
                            <a href="javascript:void(0)" id="themeToggleBtn" title="切换深色/浅色模式 (Dark/Light Theme)">
                                <i class="fa fa-moon-o theme-icon-moon"></i>
                                <i class="fa fa-sun-o theme-icon-sun"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- /.navbar-collapse -->
        </div>
        <!-- /.container -->
    </nav>

    <script>
        // Drop Bootstarp low-performance Navbar
        var $body = document.body;
        var $toggle = document.querySelector('.navbar-toggle');
        var $navbar = document.querySelector('#huxblog_navbar');
        var $collapse = document.querySelector('.navbar-collapse');

        var __HuxNav__ = {
            close: function () {
                $navbar.className = " ";
                setTimeout(function () {
                    if ($navbar.className.indexOf('in') < 0) {
                        $collapse.style.height = "0px";
                    }
                }, 400);
            },
            open: function () {
                $collapse.style.height = "auto";
                $navbar.className += " in";
            }
        };

        // Bind Event
        $toggle.addEventListener('click', function (e) {
            if ($navbar.className.indexOf('in') > 0) {
                __HuxNav__.close();
            } else {
                __HuxNav__.open();
            }
        });

        document.addEventListener('click', function (e) {
            if (e.target == $toggle) return;
            if (e.target.className == 'icon-bar') return;
            __HuxNav__.close();
        });

        // Reading Scroll Progress Indicator
        window.addEventListener('scroll', function () {
            var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            var bar = document.getElementById("readingProgressBar");
            if (bar) bar.style.width = scrolled + "%";
        });

        // Dark / Light Theme Toggle Listener
        var themeBtn = document.getElementById('themeToggleBtn');
        if (themeBtn) {
            themeBtn.addEventListener('click', function (e) {
                e.preventDefault();
                var current = document.documentElement.getAttribute('data-theme') || 'dark';
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('indexgin-theme', next);
            });
        }
    </script>
