<script src="{{ "/js/bootstrap.min.js" | prepend: site.baseurl }}"></script>

<!-- Async script helper -->
<script>
    function async(u, c) {
        var d = document, t = 'script',
            o = d.createElement(t),
            s = d.getElementsByTagName(t)[0];
        o.src = u;
        if (c) { o.addEventListener('load', function (e) { c(null, e); }, false); }
        s.parentNode.insertBefore(o, s);
    }
    async("//cdnjs.cloudflare.com/ajax/libs/fastclick/1.0.6/fastclick.min.js", function () {
        var $nav = document.querySelector("nav");
        if ($nav) FastClick.attach($nav);
    });
</script>

<!-- Analytics Tracking (Google Analytics & Baidu Tongji) -->
{% if site.ga_track_id %}
<script>
    var _gaId = '{{ site.ga_track_id }}';
    var _gaDomain = '{{ site.ga_domain }}';
    (function (i, s, o, g, r, a, m) {
        i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
            (i[r].q = i[r].q || []).push(arguments)
        }, i[r].l = 1 * new Date(); a = s.createElement(o),
            m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
    })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
    ga('create', _gaId, _gaDomain);
    ga('send', 'pageview');
</script>
{% endif %}

{% if site.ba_track_id %}
<script>
    var _baId = '{{ site.ba_track_id }}';
    var _hmt = _hmt || [];
    (function () {
        var hm = document.createElement("script");
        hm.src = "//hm.baidu.com/hm.js?" + _baId;
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
    })();
</script>
{% endif %}

<!-- Page Specific: Programming Language / Chart iframe -->
{% if page.plchart %}
<script>
    function resizeIframe(obj) {
        obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
    }
    $(document).ready(function () {
        var $chart = document.querySelector("#chart");
        if ($chart) {
            $chart.onload = function () { resizeIframe($chart); };
            window.addEventListener("resize", function () { resizeIframe($chart); });
        }
    });
</script>
{% endif %}

<!-- Page Specific: Archive Tag Cloud -->
{% if page.title == 'Archive' %}
<script>
    async('{{ "/js/jquery.tagcloud.js" | prepend: site.baseurl }}', function () {
        $.fn.tagcloud.defaults = {
            color: { start: '#bbbbee', end: '#2f93b4' },
        };
        $('#tag_cloud a').tagcloud();
    });
</script>
<script src='{{ "/js/archive.js" | prepend: site.baseurl }}'></script>
{% endif %}
