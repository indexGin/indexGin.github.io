<!-- Ambient Mathematical & Frontier Research SVG Background Layer -->
<div class="frontier-ambient-bg" aria-hidden="true">
  <svg class="frontier-svg-canvas" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Gradients -->
      <linearGradient id="mathGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
      </linearGradient>
      <linearGradient id="neuralLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4" />
        <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
      </linearGradient>
      <!-- Matrix Pattern -->
      <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#a855f7" fill-opacity="0.3" />
        <circle cx="22" cy="22" r="0.8" fill="#38bdf8" fill-opacity="0.25" />
      </pattern>
    </defs>

    <!-- 1. Ambient Dot Grid -->
    <rect width="100%" height="100%" fill="url(#matrixGrid)" />

    <!-- 2. Mathematical Optimization Formulas & Simplex Polyhedra (Top-Right) -->
    <g transform="translate(920, 60)" stroke="#a855f7" stroke-width="0.8" fill="none">
      <!-- Polyhedron Convex Hull -->
      <polygon points="120,40 240,20 320,110 260,220 90,190" stroke="url(#mathGlow)" stroke-width="1.2" stroke-dasharray="4,4" fill="rgba(168, 85, 247, 0.03)" />
      <line x1="120" y1="40" x2="260" y2="220" stroke="#a855f7" stroke-width="0.8" opacity="0.6" />
      <line x1="240" y1="20" x2="90" y2="190" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
      <!-- Vertices -->
      <circle cx="120" cy="40" r="3.5" fill="#38bdf8" />
      <circle cx="240" cy="20" r="3.5" fill="#a855f7" />
      <circle cx="320" cy="110" r="3.5" fill="#c084fc" />
      <circle cx="260" cy="220" r="3.5" fill="#38bdf8" />
      <circle cx="90" cy="190" r="3.5" fill="#a855f7" />

      <!-- Mathematical Formulation Typography in SVG -->
      <text x="70" y="270" font-family="'Fira Code', 'Newsreader', serif" font-size="16" fill="#c084fc" font-style="italic">
        min Σ c_ij · x_ij  s.t.  Ax ≤ b
      </text>
      <text x="95" y="300" font-family="'Fira Code', monospace" font-size="13" fill="#64748b">
        ∇f(x*) + λᵀ∇g(x*) = 0  (KKT)
      </text>
    </g>

    <!-- 3. Matrix Bracket Elements (Top-Left) -->
    <g transform="translate(60, 110)" stroke="#a855f7" stroke-width="1.8" fill="none">
      <!-- Left Bracket -->
      <path d="M 30,20 L 10,20 L 10,140 L 30,140" stroke="#a855f7" opacity="0.75" />
      <!-- Right Bracket -->
      <path d="M 170,20 L 190,20 L 190,140 L 170,140" stroke="#a855f7" opacity="0.75" />
      <!-- Matrix Entries -->
      <text x="35" y="55" font-family="'Fira Code', monospace" font-size="14" fill="#cbd5e1">a₁₁  ···  a₁ₙ</text>
      <text x="48" y="85" font-family="'Fira Code', monospace" font-size="14" fill="#64748b">⋮    ⋱    ⋮ </text>
      <text x="35" y="118" font-family="'Fira Code', monospace" font-size="14" fill="#cbd5e1">aₘ₁  ···  aₘₙ</text>
      <text x="210" y="85" font-family="'Fira Code', monospace" font-size="14" fill="#38bdf8">∈ ℝ^{m×n}</text>
    </g>

    <!-- 4. Neural Network Topology (Bottom-Left) -->
    <g transform="translate(80, 520)">
      <!-- Layer 1 (Input) -->
      <circle cx="40" cy="60" r="5" fill="#7c3aed" />
      <circle cx="40" cy="120" r="5" fill="#7c3aed" />
      <circle cx="40" cy="180" r="5" fill="#7c3aed" />
      <circle cx="40" cy="240" r="5" fill="#7c3aed" />

      <!-- Layer 2 (Hidden) -->
      <circle cx="160" cy="40" r="6" fill="#a855f7" />
      <circle cx="160" cy="100" r="6" fill="#a855f7" />
      <circle cx="160" cy="160" r="6" fill="#a855f7" />
      <circle cx="160" cy="220" r="6" fill="#a855f7" />
      <circle cx="160" cy="280" r="6" fill="#a855f7" />

      <!-- Layer 3 (Output) -->
      <circle cx="280" cy="110" r="6" fill="#38bdf8" />
      <circle cx="280" cy="190" r="6" fill="#38bdf8" />

      <!-- Interconnecting Synapses -->
      <path d="M 40,60 L 160,40 M 40,60 L 160,100 M 40,60 L 160,160 M 40,60 L 160,220
               M 40,120 L 160,40 M 40,120 L 160,100 M 40,120 L 160,160 M 40,120 L 160,220 M 40,120 L 160,280
               M 40,180 L 160,100 M 40,180 L 160,160 M 40,180 L 160,220 M 40,180 L 160,280
               M 40,240 L 160,160 M 40,240 L 160,220 M 40,240 L 160,280
               M 160,40 L 280,110 M 160,100 L 280,110 M 160,160 L 280,110 M 160,220 L 280,110 M 160,280 L 280,110
               M 160,100 L 280,190 M 160,160 L 280,190 M 160,220 L 280,190 M 160,280 L 280,190"
            stroke="url(#neuralLine)" stroke-width="0.8" opacity="0.65" />
      <text x="30" y="325" font-family="'Fira Code', monospace" font-size="12" fill="#a855f7">
        f_θ(x) = σ(W_L ··· σ(W₁x + b₁) + b_L)
      </text>
    </g>

    <!-- 5. Autonomous Multi-Agent Loop & Graph Routing (Bottom-Right) -->
    <g transform="translate(1000, 530)">
      <!-- Agent Cyclic Flow -->
      <circle cx="160" cy="150" r="85" stroke="url(#mathGlow)" stroke-width="1.2" stroke-dasharray="6,6" fill="none" opacity="0.6" />
      <!-- Orbiting Agent Nodes -->
      <g transform="translate(160, 65)">
        <circle cx="0" cy="0" r="14" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
        <text x="-8" y="4" font-family="'Fira Code', monospace" font-size="9" fill="#c084fc">PLAN</text>
      </g>
      <g transform="translate(245, 150)">
        <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="-7" y="4" font-family="'Fira Code', monospace" font-size="9" fill="#38bdf8">ACT</text>
      </g>
      <g transform="translate(160, 235)">
        <circle cx="0" cy="0" r="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
        <text x="-8" y="4" font-family="'Fira Code', monospace" font-size="9" fill="#34d399">SOLV</text>
      </g>
      <g transform="translate(75, 150)">
        <circle cx="0" cy="0" r="14" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.5" />
        <text x="-9" y="4" font-family="'Fira Code', monospace" font-size="9" fill="#f472b6">PERC</text>
      </g>
      <!-- Center Hub -->
      <circle cx="160" cy="150" r="28" fill="#090d16" stroke="#a855f7" stroke-width="1.2" />
      <text x="140" y="154" font-family="'Fira Code', monospace" font-size="11" fill="#ffffff" font-weight="bold">AGENT</text>

      <text x="75" y="325" font-family="'Fira Code', monospace" font-size="12" fill="#38bdf8">
        Multi-Agent Dispatch & ALNS Loop
      </text>
    </g>
  </svg>
</div>
